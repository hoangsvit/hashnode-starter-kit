mutation LikeComment($input: LikeCommentInput!) {
	likeComment(input: $input) {
		comment {
			id
			content {
				markdown
				html
			}
			author {
				name
				id
				username
				profilePicture
			}
			replies(first: 10) {
				edges {
					node {
						id
						dateAdded
						author {
							name
							id
							username
							profilePicture
						}
						content {
							markdown
							html
						}
					}
				}
			}
			dateAdded
			stamp
			totalReactions
			myTotalReactions
		}
	}
}
